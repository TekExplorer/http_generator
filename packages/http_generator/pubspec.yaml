name: http_generator
description: Code generator for creating type-safe HTTP REST clients from annotated abstract classes. Works with http_annotation package.
version: 0.0.1
repository: https://github.com/TekExplorer/http_generator
license: BSD-3-Clause
topics:
  - http
  - client
  - rest
  - api
  - build

resolution: workspace

environment:
  sdk: ^3.12.0-0
  # sdk: ^3.10.0

# Add regular dependencies here.
dependencies:
  http_annotation: ^0.0.1
  analyzer_buffer: ^0.3.0
  analyzer: '>=9.0.0 <11.0.0'
  source_gen: ^4.0.1
  source_helper: ^1.3.10
  build: ^4.0.1
  collection: ^1.19.1
  source_span: ^1.10.1
  dart_style: ^3.1.3
  meta: ^1.18.1
  # path: ^1.9.0

dev_dependencies:
  build_test: ^3.4.1
  lints: ^6.0.0
  test: ^1.25.6
  http:
  build_runner: ^2.11.1
